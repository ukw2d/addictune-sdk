[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "addictune-sdk"
version = "0.2.3"
description = "Async Python SDK for the AudioAddict radio platform (DI.FM, RadioTunes, RockRadio, JazzRadio, ClassicalRadio, ZenRadio)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "ukw2d" },
]
keywords = [
    "audioaddict",
    "di.fm",
    "digitally imported",
    "radiotunes",
    "rockradio",
    "jazzradio",
    "classicalradio",
    "zenradio",
    "radio",
    "streaming",
    "async",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
urls.Repository = "https://github.com/ukw2d/addictune-sdk"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["addictune_sdk"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "pytest-mock>=3.15.1",
]
